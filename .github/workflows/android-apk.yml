name: Android APK — NEXO POS gratuito
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-google-free-mvp
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest already contains the Android SDK. The legacy setup action
      # currently tries to install the removed SDK package "tools".
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK de pruebas
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: nexo-pos-gratis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
