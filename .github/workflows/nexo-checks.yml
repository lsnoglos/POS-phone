name: NEXO POS checks
on:
  push:
    branches:
      - main
      - feature/pos-quick-entry-scanner-google
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Business and authentication unit tests
        run: node --experimental-strip-types --test src/lib/nexo/money.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/preview-path-prefix.test.ts
      - name: Legacy Grok template tests (diagnostic only)
        continue-on-error: true
        run: npm run test
      - name: Compile application without production DB migration
        run: npm run build:dev
